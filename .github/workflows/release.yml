name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies (Linux)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libvulkan-dev \
            libfuse2

      - name: Setup MSVC (Windows)
        if: matrix.label == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Sync version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$VERSION\"/m" Cargo.toml

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Install cargo-packager
        if: matrix.label != 'windows'
        run: cargo install cargo-packager --locked

      - name: Stage artifact (Windows)
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staged | Out-Null
          Copy-Item "target/release/nscb-desktop.exe" "staged/nscb-desktop-windows-amd64.exe"

      - name: Package and stage artifact (Linux)
        if: matrix.label == 'linux'
        run: |
          cargo packager --release --formats appimage,deb
          mkdir -p staged
          cp target/packages/*.AppImage staged/nscb-desktop-linux-amd64.AppImage
          cp target/packages/*.deb staged/nscb-desktop-linux-amd64.deb

      - name: Package and stage artifact (macOS)
        if: matrix.label == 'macos'
        run: |
          cargo packager --release --formats dmg
          mkdir -p staged
          cp target/packages/*.dmg staged/nscb-desktop-macos-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nscb-desktop-${{ matrix.label }}
          path: staged/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Flatten release artifacts
        run: |
          mkdir -p artifacts
          find release-artifacts -type f -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" artifacts/* --repo "${{ github.repository }}" --title "Release $tag" --generate-notes
          fi
