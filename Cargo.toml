[workspace]
members = [".", "crates/nscb"]
resolver = "2"

[package]
name = "nscb-desktop"
version = "2.7.2"
description = "Modern desktop app for Nintendo Switch file operations"
license = "ISC"
edition = "2021"
default-run = "nscb-desktop"

[[bin]]
name = "nscb-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.9"
nscb = { path = "crates/nscb" }
dirs = "6"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"

# Installer/bundle configuration for `cargo packager --release`
# (https://github.com/crabnebula-dev/cargo-packager).
[package.metadata.packager]
product-name = "NSCB Desktop"
identifier = "com.nscb.desktop"
category = "Utility"
out-dir = "target/packages"
before-packaging-command = "cargo build --release"
binaries = [{ path = "nscb-desktop", main = true }]
icons = [
  "assets/app-icons/32x32.png",
  "assets/app-icons/128x128.png",
  "assets/app-icons/128x128@2x.png",
  "assets/app-icons/icon.icns",
  "assets/app-icons/icon.ico",
  "assets/app-icons/icon.png",
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Ad-hoc sign the whole bundle so a downloaded copy gets the normal "unidentified
# developer" prompt instead of "is damaged". Use a Developer ID to notarize.
signing-identity = "-"

[package.metadata.packager.nsis]
installer-mode = "perMachine"

[package.metadata.packager.deb]
depends = ["libxkbcommon-x11-0", "libvulkan1"]
